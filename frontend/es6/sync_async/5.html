<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function sleep(t){
      return new Promise((resolve,reject)=>{
        console.log("同步")
        setTimeout(resolve,t)
        setTimeout(reject,t*2)

      })
    }
    sleep(2000)
    .then(()=>{
      console.log("2s后")
    })
    .catch(()=>console.log("1s后"))
    console.log("end");
  </script>
</body>
</html>
